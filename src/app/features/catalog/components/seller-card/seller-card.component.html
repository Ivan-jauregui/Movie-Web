<div class="pt-4 border-t border-gray-100 space-y-4 text-xs"  [routerLink]="['/profile/public', user()?.id]">

  <div class="space-y-3">
    <div class="flex items-center gap-2 text-gray-700 font-bold">
      <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
      </svg>
      Turnos de retiro disponibles
    </div>
    <div class="grid grid-cols-2 gap-2 text-[11px]">
      <div class="p-2 border border-gray-100 rounded-lg bg-gray-50/50">
        <p class="font-bold text-gray-700">Jueves</p>
        <p class="text-gray-400">10:00 - 14:00 hs</p>
      </div>
      <div class="p-2 border border-gray-100 rounded-lg bg-gray-50/50">
        <p class="font-bold text-gray-700">Viernes</p>
        <p class="text-gray-400">14:00 - 18:00 hs</p>
      </div>
    </div>
  </div>


  @if (user(); as currentUser) {
    <div class="pt-2 space-y-3">
      <div class="flex items-center gap-3">

        <div class="relative">
          <img [src]="currentUser.photo" [alt]="currentUser.firstName + ' ' + currentUser.lastName"
               class="w-10 h-10 rounded-full object-cover">
          <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-white rounded-full"></span>
        </div>
       
        <div class="flex-1">
          <div class="flex items-center gap-1">
            <span class="font-bold text-gray-800 text-sm">{{ currentUser.firstName }} {{ currentUser.lastName }}</span>
  
            <svg class="w-4 h-4 text-emerald-500" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.066 0 012.812 2.812c.051.643.304 1.254.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.25a.75.75 0 00-1.06-1.06L9 10.94 7.53 9.47a.75.75 0 10-1.06 1.06l2 2a.75.75 0 001.06 0l4-4z" clip-rule="evenodd" />
            </svg>
          </div>
          <div class="flex items-center gap-1 text-[11px] text-gray-500">
            <div class="flex text-yellow-500">
    
              <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" /></svg>
         
            </div>
            <span class="font-bold text-gray-700">4.9</span>
            <span class="text-gray-400">· 18 ventas</span>
          </div>
        </div>
      </div>
    </div>
  }
</div>
