<div class="flex flex-col justify-center items-center mt-10 gap-6">
    <h1 class="text-3xl font-bold">Nuestras Peliculas</h1>

    <div class="flex flex-wrap gap-3">
        @for (movie of moviesService.movies(); track $index) {
            <div class="bg-gray-100 rounded-md">
                <img [src]="movie.img" [alt]="movie.name" class="w-full h-80 object-cover">
                <div class="p-4 ">
                    <h2 class="text-lg font-semibold">{{movie.name}}</h2>
                <div class="flex flex-col">
                    <p>Duracion: {{movie.duration}}</p>
                    <p>Director: {{movie.director}}</p>
                </div>
                </div>
            </div>
        }
    </div>
</div>
